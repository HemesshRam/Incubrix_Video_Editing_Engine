services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "${HOST:-0.0.0.0}", "--port", "${PORT:-8000}"]
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      IDEMPOTENCY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      STORAGE_PATH: /app/storage
      MINIO_ENDPOINT: objectstore:8333
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-incubrix-media}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      JOB_PROCESSING_TTL_SECONDS: ${JOB_PROCESSING_TTL_SECONDS:-300}
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-604800}
    depends_on:
      redis:
        condition: service_healthy
      objectstore:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "scripts.job_worker"]
    volumes:
      - ./storage:/app/storage
    environment:
      REDIS_URL: redis://redis:6379/0
      IDEMPOTENCY_BACKEND: redis
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      STORAGE_PATH: /app/storage
      MINIO_ENDPOINT: objectstore:8333
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-incubrix-media}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      JOB_PROCESSING_TTL_SECONDS: ${JOB_PROCESSING_TTL_SECONDS:-300}
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-604800}
    depends_on:
      redis:
        condition: service_healthy
      objectstore:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  objectstore:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET_NAME:-incubrix-media}
    command: ["mini", "-dir=/data"]
    volumes:
      - object_data:/data

volumes:
  redis_data:
  object_data:
